# Barakah landing page: static site + POST /api/lead on one Cloudflare Worker.
# Leads go to D1; the advisor gets an email through Cloudflare Email Routing.
name = "barakah-lead"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

# The static page in ../public is served directly; /api/* always reaches the Worker.
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Leads and consent records. Create with: npx wrangler d1 create barakah-leads
# then paste the database_id it prints here and run: npm run db:migrate
[[d1_databases]]
binding = "DB"
database_name = "barakah-leads"
database_id = "00000000-0000-0000-0000-000000000000" # TODO(setup): replace with the real id
migrations_dir = "migrations"

# Private bucket for uploaded Loan Estimates. Never bind a public domain to it.
# R2 encrypts objects at rest. Add the retention rule once:
#   npx wrangler r2 bucket lifecycle add barakah-loan-estimates le-expire le/ --expire-days 30
[[r2_buckets]]
binding = "ESTIMATES"
bucket_name = "barakah-loan-estimates"

# Advisor alerts. Needs Email Routing on the sending domain, and ALERT_TO
# added and verified as a destination address in the Cloudflare dashboard.
[[send_email]]
name = "ALERT_EMAIL"

# 5 submissions per IP per minute.
[[ratelimits]]
name = "LEAD_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
# TODO(confirm): the final landing-page origin(s), comma-separated.
ALLOWED_ORIGINS = "https://TODO-confirm-subdomain.example"
# TODO(confirm): sender on your Email Routing domain, and the advisor inbox.
ALERT_FROM = "TODO-leads@your-domain.example"
ALERT_TO = "TODO-advisor@your-domain.example"
ESTIMATE_LINK_TTL_HOURS = "72"
ESTIMATE_RETENTION_DAYS = "30"
# Keep "false" until Compliance approves storing Loan Estimates and the privacy text.
UPLOADS_ENABLED = "false"

# Secret (set with `npx wrangler secret put ESTIMATE_LINK_SECRET`, never committed).
